name: Build Ephora Viewer

# Prueba de compilación: solo assembleDebug, para obtener la lista real
# de errores del código de Linkpoint adaptado a Ephora Viewer.
# No es todavía una build de release ni una promesa de viewer funcional.

on:
  push:
    branches: [ main ]
    paths:
      - 'Linkpoint/**'
      - '.github/workflows/build-ephora.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Linkpoint/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '34'
  KOTLIN_VERSION: '1.9.22'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          build-tools: 34.0.0
          cmake: 3.22.1

      - name: Grant execute permission for gradlew
        run: |
          cd Linkpoint
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd Linkpoint
          ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ephora-debug-${{ github.sha }}
          path: Linkpoint/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports-${{ github.sha }}
          path: |
            Linkpoint/build/reports/
            Linkpoint/build/test-results/
          retention-days: 7
        continue-on-error: true
