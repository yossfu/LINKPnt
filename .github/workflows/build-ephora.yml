name: Build Ephora Viewer

# Prueba de compilación: solo assembleDebug, para obtener la lista real
# de errores del código de Linkpoint adaptado a Ephora Viewer.
# No es todavía una build de release ni una promesa de viewer funcional.

on:
  push:
    branches: [ main ]
    paths:
      - 'Linkpoint/**'
      - '.github/workflows/build-ephora.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Linkpoint/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '34'
  KOTLIN_VERSION: '1.9.22'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          # Sin cache: 'gradle' aquí: setup-gradle gestiona la caché
          # y su doc advierte contra combinar ambos mecanismos.

      # Corregido tras el run #1: setup-android v3/v4 ya NO acepta
      # api-level, build-tools, cmake ni ndk (eran entradas de v2).
      # Las únicas entradas válidas son cmdline-tools-version,
      # accept-android-sdk-licenses, log-accepted-android-sdk-licenses
      # y packages. Verificado en
      # https://github.com/android-actions/setup-android (README y
      # action.yml de v4, 2026-11-18).
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1'

      # Corregido tras el run #2: el wrapper de Gradle está incompleto
      # en el material original (falta gradle-wrapper.jar; solo existe
      # gradle-wrapper.properties, Gradle 8.5), así que ./gradlew no
      # puede arrancar. Se instala Gradle 8.5 con setup-gradle y se
      # corre `gradle` directamente. Verificado en la doc de
      # gradle/actions/setup-gradle, "Build with a specific Gradle
      # version" (2026-11-18).
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          cd Linkpoint
          gradle assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ephora-debug-${{ github.sha }}
          path: Linkpoint/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports-${{ github.sha }}
          path: |
            Linkpoint/build/reports/
            Linkpoint/build/test-results/
          retention-days: 7
        continue-on-error: true
